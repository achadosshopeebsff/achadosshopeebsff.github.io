name: Atualizar achadinhos Shopee

on:
  push:
    paths:
      - "fixed-products.json"
      - "bot-config.json"
      - "scraper/**"
      - "products.json"
      - "links.json"
      - ".github/workflows/update-products.yml"
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shopee-products
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sincronizar catálogo Shopee
        working-directory: ./scraper
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: node scrape-all.js

      - name: Publicar products.json, links.json e relógio
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json links.json sync-meta.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi

          git commit -m "Atualizar catálogo Shopee"

          # O remoto pode ter avançado entre o checkout e este push (outra
          # execução do bot, um push manual etc). Em vez de falhar, busca o
          # que há de novo e reaplica nosso commit por cima, tentando de novo
          # algumas vezes com um pequeno intervalo.
          attempt=0
          max_attempts=5
          until git push origin HEAD:main; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "❌ Falha ao publicar após $attempt tentativas."
              exit 1
            fi
            wait_seconds=$((attempt * 5))
            echo "⚠️ Push rejeitado (remoto mudou). Sincronizando e tentando de novo em ${wait_seconds}s… (tentativa $attempt/$max_attempts)"
            sleep "$wait_seconds"
            git fetch origin main
            # -X ours: em caso raro de conflito nesses 3 arquivos gerados,
            # mantém a versão mais nova (a que acabamos de coletar da Shopee).
            git rebase -X ours origin/main
          done

          echo "✅ Catálogo publicado com sucesso."
