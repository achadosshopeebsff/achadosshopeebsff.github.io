name: Atualizar achadinhos Shopee

on:
  push:
    paths:
      - "bot-config.json"
      - "links.json"
      - "scraper/**"
      - ".github/workflows/update-products.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shopee-products
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descobrir, ranquear e atualizar produtos via Shopee Affiliate API
        working-directory: ./scraper
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: node scrape-all.js

      - name: Publicar catálogo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json links.json bot-config.json fallback-products.json scraper/
          git diff --staged --quiet || git commit -m "Atualizar achadinhos Shopee"
          git push
