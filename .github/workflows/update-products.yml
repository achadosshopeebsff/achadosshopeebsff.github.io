name: Atualizar produtos da Shopee

on:
  push:
    paths:
      - "links.json"
      - "scraper/**"
      - ".github/workflows/update-products.yml"
  schedule:
    # Executa 4x ao dia para manter preço/estoque/ofertas mais recentes.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shopee-products
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Atualizar produtos via Shopee Affiliate API
        working-directory: ./scraper
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: node scrape-all.js

      - name: Publicar products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Atualizar produtos Shopee"
          git push
