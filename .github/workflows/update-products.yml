name: Atualizar produtos da Shopee

on:
  push:
    paths:
      - "links.json"
  schedule:
    # roda sozinho todo dia às 06:00 (horário UTC) pra manter preços atualizados
    - cron: "0 6 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions" do GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: ./scraper
        run: npm install

      - name: Rodar o robô e gerar products.json
        working-directory: ./scraper
        run: node scrape-all.js

      - name: Salvar products.json no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Atualizar produtos automaticamente"
          git push
